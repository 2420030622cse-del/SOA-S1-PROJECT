# ---- Server ----
server.port=8080

# ---- MySQL connection ----
# Create the database first: CREATE DATABASE perftracker_db;
spring.datasource.url=jdbc:mysql://localhost:3306/perftracker_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# 'update' auto-creates/updates tables from the entities on startup.
# Use schema.sql manually instead if your instructor requires a fixed script.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- File upload limits (for bulk import) ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
